<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mini-hot · 迷你聚合热搜</title>
  <meta name="description" content="迷你聚合热搜（mini-hot）：一个页面看微博、百度、GitHub、B站今天大家都在看什么，点标题跳回原平台。">
  <link rel="stylesheet" href="./css/base.css">
  <script>
    // 主题预置：首帧渲染前就定好深浅（手动记忆 > 系统偏好 > 浅色），
    // 避免页面打开时先闪一下错误配色（PRD M1/M4/M9）
    (function () {
      var t = null;
      try { t = localStorage.getItem("minihot.theme"); } catch (e) { /* 安静降级 */ }
      if (t !== "dark" && t !== "light") {
        try {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (e) { t = "light"; }
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <!-- 页面结构对应 PRD §6.1：
       顶部（站名 + 主题切换 + 我的收藏）
       → 来源 Tab 栏 → 时效说明 → 榜单列表 → 页脚声明
       星空背景为第 4 周视觉打磨内容，本步以纯色底占位 -->

  <div class="page">

    <!-- 顶部 -->
    <header class="topbar">
      <span class="site-name">mini-hot</span>
      <span class="spacer"></span>
      <!-- 主题切换按钮：骨架期仅占位，第 6 步 theme.js 接管 -->
      <button type="button" class="topbar-btn" id="theme-toggle" aria-label="切换深浅模式">☾ 深色</button>
      <!-- 我的收藏入口：第 5 步已接管（点击切换收藏视图） -->
      <button type="button" class="topbar-btn" id="favorites-toggle" aria-pressed="false">我的收藏</button>
    </header>

    <!-- 来源 Tab 栏：4 个 Tab 等宽，手机不折行（PRD §6.2）。
         默认选中微博；切换逻辑第 3~4 步接管，本步为静态选中态 -->
    <nav class="tabs" role="tablist" aria-label="榜单来源">
      <button type="button" class="tab tab-weibo" role="tab" aria-selected="true"  data-source="weibo">微博</button>
      <button type="button" class="tab tab-baidu" role="tab" aria-selected="false" data-source="baidu">百度</button>
      <button type="button" class="tab tab-github" role="tab" aria-selected="false" data-source="github">GitHub</button>
      <button type="button" class="tab tab-bilibili" role="tab" aria-selected="false" data-source="bilibili">B站</button>
    </nav>

    <!-- 时效说明：第 3 步接入数据后由 JS 填充 -->
    <p class="meta-line" id="meta-line">更新于 --:--</p>

    <!-- 榜单列表区 -->
    <main class="list-area" id="list-area">
      <p class="empty-hint">榜单数据将在下一步接入</p>
    </main>

    <!-- 页脚声明（PRD F4：4 个来源名称 + 免责，全部常驻可见） -->
    <footer class="footer">
      <p><strong>数据来源：</strong>
        <span class="source-dots" style="background: var(--source-weibo);"></span>微博热搜 ·
        <span class="source-dots" style="background: var(--source-baidu);"></span>百度热搜 ·
        <span class="source-dots" style="background: var(--source-github);"></span>GitHub Trending ·
        <span class="source-dots" style="background: var(--source-bilibili);"></span>哔哩哔哩排行榜
      </p>
      <p>数据来自各平台公开榜单，版权归原作者及原平台所有；本站只提供跳转，不搬运任何正文内容，仅作个人学习用途。信息请以原平台与权威媒体为准。</p>
    </footer>

  </div>

  <!-- 脚本按依赖顺序加载：theme（主题）→ api（取数）→ favorites（存储）→ components（可复用条目组件）→ render（渲染）→ main（编排） -->
  <script src="./js/theme.js" defer></script>
  <script src="./js/api.js" defer></script>
  <script src="./js/favorites.js" defer></script>
  <script src="./js/components.js" defer></script>
  <script src="./js/render.js" defer></script>
  <script src="./js/main.js" defer></script>
</body>
</html>
